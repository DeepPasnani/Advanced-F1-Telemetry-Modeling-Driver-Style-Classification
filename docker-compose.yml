version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CACHE_TTL_MINUTES=30
      - MAX_DRIVERS=6
      - ALLOWED_ORIGIN=*
    volumes:
      - ./cache:/app/cache
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
